---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Desktop image
# Motherboard: ASUS ROG STRIX X870-I GAMING WIFI
# CPU: AMD Ryzen 9 9950X (16-core Zen 5, Granite Ridge)
# GPU: AMD Radeon RX 9070 XT (Navi 48, RDNA 4, discrete)
# RAM: 96GB DDR5-5600 (2x 48GB)
# Storage: 4TB + 2TB Crucial T700 NVMe  (SAME vendor:device ID — see VFIO note)
# Network: Intel I226-V Ethernet + MediaTek MT7927 Wi-Fi 7
# Peripherals: PiKVM, SCR3500 smart card reader, ROG STRIX HIVE II
#
# Local build:   bluebuild build recipes/recipe-desktop.yml
#                -> localhost/fedora-cosmic-desktop:latest
# Published to:  ghcr.io/samwick07/fedora-cosmic-desktop:latest

name: fedora-cosmic-desktop
description: Fedora Atomic COSMIC for desktop (Ryzen 9950X + RX 9070 XT)

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44

modules:
  # Import everything shared with the Framework
  - from-file: common-modules.yml

  # ─────────────────────────────────────────────
  # DESKTOP-SPECIFIC PACKAGES
  # ─────────────────────────────────────────────
  # Nothing extra yet:
  #   - asusctl: needs the lizardue/cachyos-rising COPR; add here once tested
  #   - linux-firmware, pcsc-lite, pcsc-lite-ccid: already in base image

  # ─────────────────────────────────────────────
  # VFIO: PCIe passthrough of the 2TB NVMe to the Windows 11 VM
  # ─────────────────────────────────────────────
  # IOMMU is enabled statically here. The device binding is done by PCI
  # ADDRESS post-install (enable-vfio.sh), never by vfio-pci.ids: both T700s
  # share one vendor:device ID, so an ids= karg would grab the boot drive too.
  - type: kargs
    arch: x86_64
    kargs:
      - amd_iommu=on
      - iommu=pt

  # ─────────────────────────────────────────────
  # DESKTOP-SPECIFIC AMD GPU CONFIG
  # ─────────────────────────────────────────────
  # RX 9070 XT is Navi 48 (RDNA 4, gfx1201). Verify after install with:
  #   distrobox enter rocm -- rocminfo | grep gfx
  - type: script
    scripts:
      - configure-amd-gpu-desktop.sh

  # ─────────────────────────────────────────────
  # VFIO POST-INSTALL SCRIPT
  # ─────────────────────────────────────────────
  - type: files
    files:
      - source: scripts/enable-vfio.sh
        destination: /usr/bin/enable-vfio.sh

  - type: script
    snippets:
      - "chmod 0755 /usr/bin/enable-vfio.sh"

  # ─────────────────────────────────────────────
  # OS IDENTITY
  # ─────────────────────────────────────────────
  - type: os-release
    properties:
      NAME: Fedora Cosmic Atomic (Desktop)
      PRETTY_NAME: Fedora Cosmic Atomic for Desktop (9950X + 9070 XT)
      VARIANT: Desktop
      VARIANT_ID: desktop

  # ─────────────────────────────────────────────
  # INITRAMFS — must run after every module that touches /etc or kernel bits
  # ─────────────────────────────────────────────
  - type: initramfs

  - type: signing
