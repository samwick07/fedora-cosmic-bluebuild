---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
#
# Framework 13 AMD image
# CPU: AMD Ryzen 7040U (Phoenix, Zen 4)
# GPU: Integrated Radeon 780M (RDNA3, reports as gfx1103) — no discrete GPU
# Display: Framework 13" panel
# Special: fingerprint reader (P6), suspend-then-hibernate on lid close (F2/P2,
#          96 GB LUKS swap partition), TPM2 + PIN unlock of LUKS (P9)
#
# Local build:   bluebuild build -B podman recipes/recipe-frmwrk.yml
#                -> localhost/fedora-cosmic-frmwrk:latest
# Publish:       see docs/local-build.md
# Published to:  ghcr.io/samwick07/fedora-cosmic-frmwrk:latest

name: fedora-cosmic-frmwrk
description: Fedora Atomic COSMIC for Framework 13 AMD

base-image: quay.io/fedora-ostree-desktops/cosmic-atomic
image-version: 44

modules:
  # Import everything shared with the desktop
  - from-file: common-modules.yml

  # ─────────────────────────────────────────────
  # FRAMEWORK-SPECIFIC PACKAGES
  # ─────────────────────────────────────────────
  # Installing a package that the base already ships is a no-op, so these are
  # listed even though some are probably present: it documents the dependency.
  - type: dnf@v1
    install:
      install-weak-deps: false
      packages:
        - fprintd                 # P6 fingerprint reader
        - fprintd-pam
        - checkpolicy             # build time only: compiles the hibernation SELinux module, removed below
        # power-profiles-daemon is NOT listed: it conflicts with tuned-ppd,
        # which the base image ships and which provides the same D-Bus API.

  # ─────────────────────────────────────────────
  # HIBERNATION: suspend-then-hibernate on lid close
  # ─────────────────────────────────────────────
  # Bakes in: sleep.conf.d + logind.conf.d drop-ins, SELinux policy module.
  # resume= and rd.luks.uuid= are per installation: Anaconda writes them (stock ISO,
  # spec L1); enable-hibernation.sh checks and adds what is missing.
  # See docs/hibernation-setup.md.
  - type: script@v2
    scripts:
      - configure-hibernation.sh

  - type: script@v2
    snippets:
      - "dnf -y -q remove checkpolicy"

  # ─────────────────────────────────────────────
  # P9: TPM2 unlock of LUKS (with a PIN) — tpm2-tss in the initramfs
  # ─────────────────────────────────────────────
  - type: files@v1
    files:
      - source: lib/90-tpm2.conf
        destination: /usr/lib/dracut/dracut.conf.d/90-tpm2.conf

  - type: files@v1
    files:
      - source: scripts/enable-hibernation.sh
        destination: /usr/bin/enable-hibernation.sh
      # L1/F2: at every boot, add resume= / rd.luks.uuid when missing (staged)
      - source: systemd/system/cosmic-hibernation.service
        destination: /usr/lib/systemd/system/cosmic-hibernation.service

  - type: script@v2
    snippets:
      - "chmod 0755 /usr/bin/enable-hibernation.sh && chmod 0644 /usr/lib/dracut/dracut.conf.d/90-tpm2.conf /usr/lib/systemd/system/cosmic-hibernation.service && systemctl enable cosmic-hibernation.service"

  # ─────────────────────────────────────────────
  # BOOT SPLASH: graphical LUKS prompt
  # ─────────────────────────────────────────────
  # Without rhgb/quiet plymouth runs in text mode: the passphrase prompt prints
  # ~2 s into boot and kernel messages scroll it off screen (2TB first boot).
  # bootc install and bootc upgrade both apply kargs.d.
  - type: kargs@v1
    kargs:
      - rhgb
      - quiet

  # ─────────────────────────────────────────────
  # OS IDENTITY
  # ─────────────────────────────────────────────
  - type: os-release@v1
    properties:
      NAME: Fedora Cosmic Atomic (Framework)
      PRETTY_NAME: Fedora Cosmic Atomic for Framework 13 AMD
      VARIANT: Framework
      VARIANT_ID: frmwrk

  # ─────────────────────────────────────────────
  # INITRAMFS — must run after every module that touches /etc or kernel bits
  # ─────────────────────────────────────────────
  - type: initramfs@v1

  - type: signing@v1

  # Local builds sign for localhost/<image> (BlueBuild CLI bug); point the
  # policy at the published name so bootc verifies updates.
  - type: script@v2
    scripts:
      - fix-signing-registry.sh
