---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
#
# Shared modules for the laptop (frmwrk) and the desktop (dsktp).
# Every line here answers to a row of docs/end-state.md (the spec).
#
# F9 — BASE IMAGE AS CLOSE TO STOCK AS POSSIBLE:
#   An RPM is layered only when it needs the host kernel or a host service, or when
#   the root nightly job runs it (root must never execute files the user can write).
#   Configuration files are fine. Everything else is a flatpak, a distrobox
#   (dotfiles: dev, claude, rocm, vpn) or a single binary in $HOME (dotfiles).
#
# OSTREE PATH RULES: ship under /usr and /etc only. /usr/local -> /var/usrlocal,
# /opt -> /var/opt, /home -> /var/home; anything written under /var at build time is
# applied once by `bootc install` and never again on upgrade.

modules:
  # ─────────────────────────────────────────────
  # PACKAGES (the whole layered set; spec F9)
  # ─────────────────────────────────────────────
  - type: dnf@v1
    repos:
      files:
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      keys:
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
    install:
      install-weak-deps: false
      packages:
        # V1: Win11 VM (KVM, libvirt modular daemons, UEFI + Secure Boot, TPM 2.0)
        - qemu-kvm
        - libvirt
        - libvirt-daemon-kvm
        - edk2-ovmf
        - swtpm
        - swtpm-tools
        # N3: Tailscale (host daemon, /dev/net/tun)
        - tailscale
        # N4: VPN trial — Cisco (AnyConnect protocol) from COSMIC's network menu.
        #     Removed again if the trial picks the vendor client in the vpn box.
        - NetworkManager-openconnect
        # J1: run by the root nightly job (never a user-writable binary under root)
        - restic
        - distrobox
        # V3/V2: CAC on the host — pcscd, CCID driver, OpenSC (p11-kit module for
        # Firefox). Already in the base: listing them is a no-op that documents the need.
        - pcsc-lite
        - pcsc-lite-ccid
        - opensc

  # ─────────────────────────────────────────────
  # V4: DoD PKI roots in the system trust (build step, verified, no runtime fetch)
  # ─────────────────────────────────────────────
  - type: script@v2
    scripts:
      - install-dod-roots.sh

  # ─────────────────────────────────────────────
  # SERVICES
  # ─────────────────────────────────────────────
  # libvirt runs as modular daemons on Fedora. Do NOT enable libvirtd.service.
  - type: systemd@v1
    system:
      enabled:
        - tailscaled.service
        - pcscd.socket
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtnodedevd.socket
        - virtsecretd.socket
        - virtinterfaced.socket
        - cosmic-nightly.timer          # J1: backup, drift, staged upgrades; never reboots

  # ─────────────────────────────────────────────
  # FLATPAKS (GUI apps; spec 3.5). Keep in step with files/share/flatpaks.list
  # (the drift report's reference; the smoke test compares the two).
  # ─────────────────────────────────────────────
  # Browsers are not flatpaks: Chrome is the RPM in the dev distrobox, Firefox
  # the base image's RPM (both CAC capable).
  - type: default-flatpaks@v2
    configurations:
      - notify: true
        scope: system
        install:
          - com.collaboraoffice.Office      # A16 office
          - org.signal.Signal               # A16b
          - org.videolan.VLC                # A16b
          - org.inkscape.Inkscape           # A16b
          - org.gimp.GIMP                   # A7
          - org.darktable.Darktable         # A7
          - com.calibre_ebook.calibre       # A8
          - org.remmina.Remmina             # A12 RDP
          - com.usebottles.bottles          # A11 Notepad++ and other small Windows apps
          - com.github.tchx84.Flatseal      # A13
          - org.virt_manager.virt-manager   # A14 trial: manages qemu:///system? else layer it
      - scope: user

  # ─────────────────────────────────────────────
  # FILES SHIPPED IN THE IMAGE
  # ─────────────────────────────────────────────
  # cosmic-nightly        J1: the one scheduled job (+ timer/service, notifier, settings template)
  # cosmic-session-wait   D1: login waits until the greeter released the GPU (cosmic-comp#2690)
  # win11-cac             V2: hand the USB CAC reader to Win11VM and back
  # cac-status            V2–V4: read-only CAC report
  # cosmic-report         machine state for the journal or a bug report (--public, --offline)
  - type: files@v1
    files:
      - source: scripts/cosmic-nightly.sh
        destination: /usr/bin/cosmic-nightly
      - source: scripts/cosmic-nightly-notify.sh
        destination: /usr/bin/cosmic-nightly-notify
      - source: scripts/cosmic-session-wait.sh
        destination: /usr/bin/cosmic-session-wait
      - source: scripts/win11-cac.sh
        destination: /usr/bin/win11-cac
      - source: scripts/cac-status.sh
        destination: /usr/bin/cac-status
      - source: scripts/cosmic-report.sh
        destination: /usr/bin/cosmic-report
      - source: systemd/system/cosmic-nightly.service
        destination: /usr/lib/systemd/system/cosmic-nightly.service
      - source: systemd/system/cosmic-nightly.timer
        destination: /usr/lib/systemd/system/cosmic-nightly.timer
      - source: xdg/cosmic-nightly-notify.desktop
        destination: /etc/xdg/autostart/cosmic-nightly-notify.desktop
      - source: share/flatpaks.list
        destination: /usr/share/fedora-cosmic-atomic/flatpaks.list
      - source: share/drift-ignore.regex
        destination: /usr/share/fedora-cosmic-atomic/drift-ignore.regex
      - source: share/nightly.example.env
        destination: /usr/share/fedora-cosmic-atomic/nightly.example.env
      # N1: first boot has no network; the default-flatpaks units retry until it works
      - source: systemd/system-flatpak-setup.service.d/20-retry.conf
        destination: /usr/lib/systemd/system/system-flatpak-setup.service.d/20-retry.conf
      - source: systemd/user-flatpak-setup.service.d/20-retry.conf
        destination: /usr/lib/systemd/user/user-flatpak-setup.service.d/20-retry.conf
      # P11: DDC/CI monitor brightness without root (ddcutil lives in the dev box)
      - source: lib/i2c-dev.conf
        destination: /usr/lib/modules-load.d/i2c-dev.conf
      - source: lib/60-i2c-uaccess.rules
        destination: /usr/lib/udev/rules.d/60-i2c-uaccess.rules

  # git does not reliably preserve modes through the build context; with umask 077
  # data files would land 0600 and the user session could not read them.
  - type: script@v2
    snippets:
      - "chmod 0755 /usr/bin/cosmic-nightly /usr/bin/cosmic-nightly-notify /usr/bin/cosmic-session-wait /usr/bin/win11-cac /usr/bin/cac-status /usr/bin/cosmic-report"
      - "chmod 0644 /usr/lib/systemd/system/cosmic-nightly.service /usr/lib/systemd/system/cosmic-nightly.timer /etc/xdg/autostart/cosmic-nightly-notify.desktop /usr/share/fedora-cosmic-atomic/flatpaks.list /usr/share/fedora-cosmic-atomic/drift-ignore.regex /usr/share/fedora-cosmic-atomic/nightly.example.env /usr/lib/systemd/system/system-flatpak-setup.service.d/20-retry.conf /usr/lib/systemd/user/user-flatpak-setup.service.d/20-retry.conf /usr/lib/modules-load.d/i2c-dev.conf /usr/lib/udev/rules.d/60-i2c-uaccess.rules"

  # ─────────────────────────────────────────────
  # D1 LOGIN: wait for the greeter to release the GPU
  # ─────────────────────────────────────────────
  # cosmic-comp#2690: the session's compositor starts while the greeter's still
  # holds /dev/dri/cardN -> EBUSY -> black screen on every login (2TB first boot,
  # COSMIC 1.8.0). Fails the build if upstream changes the Exec line, so the
  # workaround never silently drops out. Remove when cosmic-comp retries itself.
  - type: script@v2
    snippets:
      - "f=/usr/share/wayland-sessions/cosmic.desktop; grep -qx 'Exec=/usr/bin/start-cosmic' $f || { echo \"$f: unexpected Exec line:\"; grep '^Exec' $f; exit 1; }; sed -i 's|^Exec=/usr/bin/start-cosmic$|Exec=/usr/bin/cosmic-session-wait|' $f && grep -qx 'Exec=/usr/bin/cosmic-session-wait' $f"
