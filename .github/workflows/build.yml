name: bluebuild

# Images are built and pushed LOCALLY (see docs/local-build.md). This workflow
# is kept only as a fallback for when the laptop is unavailable — run it by
# hand from the Actions tab. No schedule, no push trigger, no PR builds:
# every one of those costs GitHub Actions minutes for no benefit.
on:
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build"
        required: true
        default: recipe-framework.yml
        type: choice
        options:
          - recipe-framework.yml
          - recipe-desktop.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Build Custom Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ inputs.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ secrets.GHCR_TOKEN }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
