name: bluebuild

# Nightly rebuild of the published image, only when something changed:
#   - the base image digest differs from the one the published image was built on
#     (Fedora pushes cosmic-atomic:44 around 03:10 UTC), or
#   - no published image carries this commit's <sha7>-44 tag.
# scripts/smoke-test.sh gates the push. This is the primary build (free for a
# public repo); local builds (docs/local-build.md) test a change before pushing.
# Pull requests that touch the image are built and smoke-tested, never pushed.
#
# One-time setup:
#   - Secret SIGNING_SECRET = contents of cosign.key (the key cosign.pub belongs to).
#   - GHCR push: either give this repo Write access in the package settings
#     (ghcr.io/samwick07/fedora-cosmic-frmwrk -> Manage Actions access), which
#     lets the built-in GITHUB_TOKEN push, or add secret GHCR_TOKEN (classic PAT,
#     write:packages).
on:
  schedule:
    - cron: "17 6 * * *"
  # Every pull request that changes the image is built and smoke-tested, never pushed.
  pull_request:
    paths:
      - "recipes/**"
      - "files/**"
      - "scripts/smoke-test.sh"
      - "scripts/check-leaks.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      recipe:
        description: "Recipe to build"
        required: true
        default: recipe-frmwrk.yml
        type: choice
        options:
          - recipe-frmwrk.yml
          - recipe-dsktp.yml
      force:
        description: "Build even if base and repo are unchanged"
        type: boolean
        default: false
      chunked_oci:
        description: "Rechunk with rpm-ostree build-chunked-oci (trial; compare update size)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ inputs.recipe || 'recipe-frmwrk.yml' }}
  cancel-in-progress: false

env:
  RECIPE: recipes/${{ inputs.recipe || 'recipe-frmwrk.yml' }}
  BLUEBUILD_INSTALLER: ghcr.io/blue-build/cli:v0.9.37-installer
  REGISTRY_NAMESPACE: samwick07

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: decide
        env:
          FORCE: ${{ inputs.force || github.event_name == 'pull_request' }}
        run: |
          scripts/ci-should-build.sh "$RECIPE" | tee -a "$GITHUB_OUTPUT"
          grep '^reason=' "$GITHUB_OUTPUT" | tail -1 | sed 's/^reason=/**Decision:** /' >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    env:
      BB_USERNAME: ${{ github.actor }}
      BB_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      BB_REGISTRY: ghcr.io
      BB_REGISTRY_NAMESPACE: samwick07
      CHUNKED: ${{ inputs.chunked_oci && '--build-chunked-oci' || '' }}
    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "80G"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install BlueBuild CLI (pinned) and cosign
        run: |
          docker create --name bb-installer "$BLUEBUILD_INSTALLER"
          sudo docker cp bb-installer:/out/bluebuild /usr/local/bin/bluebuild
          docker rm bb-installer
          bluebuild --version
          podman --version
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Registry login
        if: github.event_name != 'pull_request'
        run: printf '%s' "$BB_PASSWORD" | podman login ghcr.io -u "$BB_USERNAME" --password-stdin

      # Build only; nothing leaves the runner unless the smoke test passes.
      - name: Build
        run: bluebuild build -v -B podman ${CHUNKED:+"$CHUNKED"} "$RECIPE"

      - name: Smoke test
        env:
          IMAGE: ${{ needs.check.outputs.image }}
        run: |
          imgs=$(podman images --format '{{.Repository}}:{{.Tag}}')
          name=${IMAGE##*/}
          # The tag BlueBuild gives a build-only image has varied between versions:
          # prefer latest_linux_amd64, else the newest tag of our image.
          img=$(grep -m1 -E "(^|/)$name:latest_linux_amd64$" <<<"$imgs" || grep -m1 -E "(^|/)$name:" <<<"$imgs" || true)
          if [[ -z "$img" ]]; then
            echo "::error title=smoke test::no image named $name after the build. podman images: $(tr '\n' ' ' <<<"$imgs")"
            exit 1
          fi
          echo "smoke-testing $img"
          scripts/smoke-test.sh "$img"

      # Same build again with --push: every layer is cached, so this tags,
      # pushes and signs what was just tested.
      - name: Push + sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          [[ -n "$COSIGN_PRIVATE_KEY" ]] || { echo "::error::secret SIGNING_SECRET is not set"; exit 1; }
          bluebuild build -v -B podman ${CHUNKED:+"$CHUNKED"} --push --registry ghcr.io --registry-namespace samwick07 "$RECIPE"

      - name: Verify signature
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cosign verify --key cosign.pub "${{ needs.check.outputs.image }}:latest" > /dev/null && echo "signature OK" >> "$GITHUB_STEP_SUMMARY"
