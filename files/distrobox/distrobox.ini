# distrobox assemble manifest — shipped in the image at /usr/share/distrobox/distrobox.ini
#
# Create / update everything:   distrobox assemble create --file /usr/share/distrobox/distrobox.ini
# Rebuild one from scratch:     distrobox assemble create --file ... --name dev --replace
# Remove everything:            distrobox assemble rm     --file /usr/share/distrobox/distrobox.ini
# Update packages in place:     distrobox upgrade --all
#
# The chezmoi dotfiles repo runs the create command once (run_once_20-distrobox.sh).
# Semantics: additional_packages are installed by distrobox-init; pre_init_hooks
# run as root BEFORE that (repo setup goes here, must be idempotent);
# init_hooks run as root AFTER packages on every container start.
#
# Lanes, for reference:  GUI apps -> flatpak · CLI tools -> Homebrew (~/.Brewfile)
#                        toolchains / IDEs / vendor stacks -> these boxes
# NOTE: exported_apps runs distrobox-export at assemble time, so the .desktop must
# come from a package listed above (claude-desktop, code, antigravity do).

# ─── dev: Fedora 44 — VS Code, Antigravity, Node, Java, Python, build tools ─────
[dev]
image=registry.fedoraproject.org/fedora-toolbox:44
pull=true
start_now=false
# Vendor repos, written idempotently before package install.
pre_init_hooks=rpm --import https://packages.microsoft.com/keys/microsoft.asc 2>/dev/null; printf '[code]\nname=Visual Studio Code\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\nenabled=1\ngpgcheck=1\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\n' > /etc/yum.repos.d/vscode.repo; printf '[antigravity-rpm]\nname=Antigravity RPM Repository\nbaseurl=https://us-central1-yum.pkg.dev/projects/antigravity-auto-updater-dev/antigravity-rpm\nenabled=1\ngpgcheck=0\n' > /etc/yum.repos.d/antigravity.repo
additional_packages="code antigravity"
additional_packages="git git-lfs gcc gcc-c++ make cmake pkgconf-pkg-config"
additional_packages="nodejs22 nodejs22-npm java-25-openjdk-devel python3-devel python3-pip"
additional_packages="ShellCheck shfmt nmap tcpdump traceroute mtr"
additional_packages="bash-completion man-db man-pages vim"
# Launchers on the host application menu + `code` / `antigravity` on the host PATH.
exported_apps="code antigravity"
exported_bins="/usr/bin/code /usr/bin/antigravity"
exported_bins_path="~/.local/bin"

# ─── claude: Ubuntu 24.04 — Claude Desktop (.deb via apt repo) + Claude Code CLI ──
# This is how the app runs today (exported from the old "ClaudeCode" box) and stays
# so until an official RPM or flatpak exists. The CLI is installed into this box
# by the dotfiles repo (run_once_25-claude-cli.sh); `claude` on the host is an
# alias for `distrobox enter claude -- claude`.
[claude]
image=docker.io/library/ubuntu:24.04
pull=true
start_now=false
# Vendor apt repo, before distrobox-init installs packages. curl first: the bare
# ubuntu image has none. The key is armored (.asc), which apt reads directly.
# Single quotes only: distrobox assemble truncates the hook at a double quote.
pre_init_hooks=export DEBIAN_FRONTEND=noninteractive; apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null; install -d /usr/share/keyrings; curl -fsSL https://downloads.claude.ai/claude-desktop/key.asc -o /usr/share/keyrings/claude-desktop-archive-keyring.asc; echo 'deb [arch=amd64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main' > /etc/apt/sources.list.d/claude-desktop.list; apt-get update -qq
additional_packages="claude-desktop"
additional_packages="bash-completion ca-certificates curl git gnupg less locales man-db mesa-vulkan-drivers ripgrep vim wget"
init_hooks=locale-gen en_US.UTF-8 >/dev/null 2>&1 || true
# "Claude (on claude)" in the app menu, same as today.
exported_apps="claude-desktop"

# ─── rocm: AMD ROCm compute (OpenCL, HIP, rocminfo) ────────────────────────────
# ~5 GB, Ubuntu-based vendor image. distrobox passes /dev (kfd, dri) through
# by default; the render/video groups come from the host user.
# Framework 780M = gfx1103 -> export HSA_OVERRIDE_GFX_VERSION=11.0.0 (set in
# the image's /etc/environment.d and inherited by the container).
[rocm]
image=docker.io/rocm/rocm-terminal:latest
pull=true
start_now=false
additional_packages="bash-completion btop fastfetch git python3-pip tmux vim"
