# distrobox container definition: fedora-ws
# Fedora Workstation — system CLI tools and dev utilities
#
# This is the primary "daily driver" container for CLI work. It holds the
# tools that don't need kernel access but are awkward as flatpaks: system
# monitors, network utilities, text editors, Python/uv, OCR, etc.
#
# This file is sourced by distrobox-setup.sh. Variables:
#   CONTAINER_NAME         — distrobox container name
#   CONTAINER_IMAGE        — OCI image to use
#   CONTAINER_HOSTNAME     — hostname inside the container
#   ADDITIONAL_PACKAGES    — packages installed during distrobox-init (comma-sep)
#   PACKAGES               — shell commands to install the rest (dnf repos + packages)
#   INIT_HOOKS             — shell commands run before package installation

CONTAINER_NAME="fedora-ws"
CONTAINER_IMAGE="docker.io/fedora:latest"
CONTAINER_HOSTNAME="frmwrk"

# Packages distrobox-init needs for basic integration
ADDITIONAL_PACKAGES="bash-completion,less,man-db,vim"

# Init: add COPR repos that aren't in the host image
INIT_HOOKS='
set -e
dnf copr enable -y atim/starship
dnf copr enable -y pgaskin/zotero
'

# Full package install: CLI tools, dev utilities, network diagnostics
PACKAGES='
set -e
dnf install -y \
  btop fastfetch micro pigz tesseract \
  nmap tcpdump traceroute mtr \
  python3-pip uv \
  starship \
  ShellCheck shfmt \
  ripgrep fd-find bat eza zoxide fzf \
  jq yq \
  man-pages man-pages-extra \
  openssh-clients rsync tree \
  && dnf clean all
'
