# distrobox container definition: ClaudeCode
# Ubuntu 24.04 (Noble) — Claude Desktop app + development tools
#
# This file is sourced by distrobox-setup.sh. Variables:
#   CONTAINER_NAME         — distrobox container name
#   CONTAINER_IMAGE        — OCI image to use
#   CONTAINER_HOSTNAME     — hostname inside the container
#   ADDITIONAL_PACKAGES    — packages installed during distrobox-init (comma-sep)
#   PACKAGES               — shell commands to install the rest (apt repos + packages)
#   INIT_HOOKS             — shell commands run before package installation

CONTAINER_NAME="ClaudeCode"
CONTAINER_IMAGE="docker.io/library/ubuntu:latest"
CONTAINER_HOSTNAME="frmwrk"

# Packages distrobox-init needs for basic integration
ADDITIONAL_PACKAGES="bash-completion,less,man-db,vim"

# Init: add Claude Desktop apt repo
INIT_HOOKS='
set -e
export DEBIAN_FRONTEND=noninteractive

# Claude Desktop
wget -qO - https://downloads.claude.ai/claude-desktop/apt/stable/key.gpg | gpg --dearmor -o /usr/share/keyrings/claude-desktop-archive-keyring.asc
echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main" > /etc/apt/sources.list.d/claude-desktop.list

apt-get update
'

# Full package install: system tools + Claude Desktop
PACKAGES='
export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
apt-get install -y -qq \
  bash-completion bc bzip2 claude-desktop curl dialog gnupg gnupg2 gpgsm \
  iproute2 iputils-ping keyutils language-pack-en less locales logsave \
  lsof man-db manpages mawk mesa-vulkan-drivers mtr openssh-client \
  perl-base pigz pinentry-curses procps rsync sensible-utils sudo tcpdump \
  time traceroute tree tzdata ubuntu-keyring unzip wget xauth zip zlib1g
apt-get clean
'
