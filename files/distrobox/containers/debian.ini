# distrobox container definition: debian
# Debian Trixie — general-purpose container with browsing, Signal, OCR, media
#
# This file is sourced by distrobox-setup.sh. Variables:
#   CONTAINER_NAME         — distrobox container name
#   CONTAINER_IMAGE        — OCI image to use
#   CONTAINER_HOSTNAME     — hostname inside the container
#   ADDITIONAL_PACKAGES    — packages installed during distrobox-init (comma-sep)
#   PACKAGES               — shell commands to install the rest (apt repos + packages)
#   INIT_HOOKS             — shell commands run before package installation

CONTAINER_NAME="debian"
CONTAINER_IMAGE="docker.io/library/debian:latest"
CONTAINER_HOSTNAME="frmwrk"

# Packages distrobox-init needs for basic integration
ADDITIONAL_PACKAGES="bash-completion,less,man-db,vim"

# Init: add third-party apt repos before installing their packages
INIT_HOOKS='
set -e
export DEBIAN_FRONTEND=noninteractive

# Signal Desktop
wget -qO - https://updates.signal.org/desktop/apt/keys.asc | gpg --dearmor -o /usr/share/keyrings/signal-desktop-keyring.gpg
echo "deb [arch=amd64 signed-by=/usr/share/keyrings/signal-desktop-keyring.gpg] https://updates.signal.org/desktop/apt xenial main" > /etc/apt/sources.list.d/signal-xenial.list

# Thorium Browser
echo "deb [trusted=yes arch=amd64] https://dl.thorium.rocks/debian/ stable main" > /etc/apt/sources.list.d/thorium.list

# Jellyfin
mkdir -p /etc/apt/keyrings
wget -qO - https://repo.jellyfin.org/jellyfin_team.gpg.key | gpg --dearmor -o /etc/apt/keyrings/jellyfin.gpg
cat > /etc/apt/sources.list.d/jellyfin.sources <<JELLYFIN
Types: deb
URIs: https://repo.jellyfin.org/debian
Suites: trixie
Components: main
Architectures: amd64
Signed-By: /etc/apt/keyrings/jellyfin.gpg
JELLYFIN

apt-get update
'

# Full package install: system tools + third-party apps
PACKAGES='
export DEBIAN_FRONTEND=noninteractive
apt-get update -qq
apt-get install -y -qq \
  bash-completion bc bzip2 curl dialog diffutils fastfetch findutils \
  gnupg gnupg2 gpgsm iproute2 iputils-ping keyutils less libcap2-bin \
  libegl1 libegl1-mesa libegl-mesa0 libgl1 libgl1-mesa-glx libglx-mesa0 \
  libkrb5-3 libnss-mdns libnss-myhostname libvte-2.91-common libvte-common \
  libvulkan1 locales lsof man-db manpages mesa-vulkan-drivers mtr \
  nala ncurses-base ocrmypdf openssh-client pigz pinentry-curses procps \
  rsync signal-desktop sudo tcpdump thorium-browser time traceroute tree \
  tzdata unzip util-linux wget xauth xz-utils zip \
  jellyfin
apt-get clean
'
