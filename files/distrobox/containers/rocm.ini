# distrobox container definition: rocm
# AMD ROCm — GPU compute (OpenCL, rocminfo) with device passthrough
#
# ROCm is containerized because:
#   - It's a large stack (~5GB) that would bloat the image
#   - It needs GPU device access (/dev/kfd, /dev/dri) which distrobox can pass through
#   - ROCm versions can be pinned independently of the host
#
# The distrobox-setup.sh script detects the CREATE_FLAGS variable and passes
# them as additional flags to distrobox-create.
#
# After entering the container, verify GPU access:
#   rocminfo | grep gfx
#   rocm-clinfo
#
# If HSA_OVERRIDE_GFX_VERSION is needed (RDNA3 APUs), set it in the container:
#   echo 'export HSA_OVERRIDE_GFX_VERSION=11.0.0' >> ~/.bashrc
#
# This file is sourced by distrobox-setup.sh. Variables:
#   CONTAINER_NAME         — distrobox container name
#   CONTAINER_IMAGE        — OCI image to use
#   CONTAINER_HOSTNAME     — hostname inside the container
#   ADDITIONAL_PACKAGES    — packages installed during distrobox-init (comma-sep)
#   PACKAGES               — shell commands to install the rest
#   INIT_HOOKS             — shell commands run before package installation
#   CREATE_FLAGS           — extra flags passed to distrobox-create

CONTAINER_NAME="rocm"
CONTAINER_IMAGE="docker.io/rocm/rocm-terminal:latest"
CONTAINER_HOSTNAME="frmwrk"

# GPU device passthrough — distrobox needs these to access the AMD GPU
CREATE_FLAGS="--additional-flags --device=/dev/kfd --additional-flags --device=/dev/dri"

# Packages distrobox-init needs for basic integration
ADDITIONAL_PACKAGES="bash-completion,less,man-db,vim"

# Init: no special repos needed — rocm-terminal already has the ROCm stack
INIT_HOOKS='
set -e
'

# Install additional tools on top of the ROCm base image
PACKAGES='
set -e
apt-get update -qq
apt-get install -y -qq \
  btop fastfetch tmux git \
  python3-pip \
  && apt-get clean
'
