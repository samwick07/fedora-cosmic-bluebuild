# distrobox assemble manifest for the ROOTFUL `net` box (spec N4, N5, C1c). Shipped by the
# image and created by cosmic-net-box.service — nobody runs this by hand.
#
# Rootful because the vendor VPN clients run root services (Cisco's vpnagentd, Windscribe's
# helper) and raw-socket tools need real root on the host network; a rootless box cannot
# have either. Boxes share the host network, so a tunnel brought up here reaches the host,
# dev, claude, rocm and podman containers. init=true: the vendor packages enable systemd units.
#
# Vendor packages: cosmic-net-box fetches Windscribe's .deb from its publisher (spec F10) into
# /var/lib/net-box/packages/ (read-only as /packages) and installs it with apt; Cisco comes
# from the kept web-deploy installer in /var/lib/net-box/installers/ (read-only as
# /installers; the noted F10 exception, N4).
[net]
image=docker.io/library/ubuntu:24.04
pull=true
root=true
init=true
start_now=true
additional_packages="systemd libpam-systemd iproute2 iptables ca-certificates curl"
additional_packages="nmap mtr-tiny tcpdump traceroute dnsutils"
volume="/var/lib/net-box/packages:/packages:ro"
volume="/var/lib/net-box/installers:/installers:ro"
