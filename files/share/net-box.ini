# distrobox assemble manifest for the ROOTFUL `net` box (spec N4, N5, C1c). Shipped by the
# image and created by cosmic-net-box.service — nobody runs this by hand.
#
# Rootful because the vendor VPN clients run root services (Cisco's vpnagentd, Windscribe's
# helper) and raw-socket tools need real root on the host network; a rootless box cannot
# have either. Boxes share the host network, so a tunnel brought up here reaches the host,
# dev, claude and podman containers. init=true: the vendor installers enable systemd units.
#
# Vendor installers: /var/lib/net-box/installers/ (in /var state, so the backups carry it and
# a rebuilt machine reinstalls unattended): Cisco's web-deploy .sh or .deb (copied once by
# the migration, M10), the Windscribe .deb (fetched by cosmic-net-box). Cisco profiles are
# kept in /var/lib/net-box/cisco-profile/ and copied in and out by cosmic-net-box.
[net]
image=docker.io/library/ubuntu:24.04
pull=true
root=true
init=true
start_now=true
additional_packages="systemd libpam-systemd iproute2 iptables ca-certificates curl"
# Cisco Secure Client 5.1 needs (release notes, "Linux requirements"): GTK 3, WebKitGTK for the
# SAML login window, NSS tools for the certificate store, libxml2, zlib.
additional_packages="libgtk-3-0t64 libwebkit2gtk-4.1-0 libnss3-tools libxml2 zlib1g"
additional_packages="nmap mtr-tiny tcpdump traceroute dnsutils"
volume="/var/lib/net-box/installers:/installers:ro"
