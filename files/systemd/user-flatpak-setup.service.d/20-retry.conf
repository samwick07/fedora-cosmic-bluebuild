# Retry until it succeeds. On a fresh install the first boot usually has no
# network yet (Wi-Fi profiles come back with post-install-setup.sh step 2), the
# unit fails on "Could not resolve hostname" and nothing ever runs it again:
# the first test install ended up with no system flatpaks at all (2026-10-03).
# Same drop-in for the user unit (user-flatpak-setup.service).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=5min
