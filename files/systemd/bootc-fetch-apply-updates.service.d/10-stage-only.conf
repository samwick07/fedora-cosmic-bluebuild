# Stage updates, never apply them: Fedora's unit runs `bootc upgrade --apply`,
# which reboots. Here the new image is only downloaded and staged; it takes
# effect at the next reboot you choose (hibernate/resume keeps the current one).
# Idle priority so a long-running job never notices it.
[Unit]
Description=Stage bootc updates (applied at the next reboot)

[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
Nice=10
IOSchedulingClass=idle
